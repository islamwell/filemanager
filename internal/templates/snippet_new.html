{{template "base" .}}

{{define "content"}}
<div style="max-width: 800px; margin: 1.5rem auto;">
  <div class="card-section">
    <div class="card-title">
      <span>Create New Text Snippet</span>
      <span id="charCounter" style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted);">0 / 10,000 characters</span>
    </div>

    <form action="/snippets" method="POST">
      <input type="hidden" name="_csrf" value="{{.CSRFToken}}">

      <div class="form-group">
        <label class="form-label" for="snippetTitle">Title</label>
        <input type="text" id="snippetTitle" name="title" class="form-control" placeholder="e.g. Database Connection Config" required autofocus value="{{if .Data}}{{if (index .Data "Title")}}{{index .Data "Title"}}{{end}}{{end}}">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="snippetLang">Syntax / Language</label>
          <select id="snippetLang" name="language" class="form-control">
            <option value="text">Plain Text</option>
            <option value="go">Go</option>
            <option value="json">JSON</option>
            <option value="python">Python</option>
            <option value="javascript">JavaScript</option>
            <option value="html">HTML / XML</option>
            <option value="css">CSS</option>
            <option value="sql">SQL</option>
            <option value="markdown">Markdown</option>
            <option value="bash">Shell / Bash</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="snippetCat">Folder</label>
          <select id="snippetCat" name="category_id" class="form-control">
            <option value="">(Root / No Folder)</option>
            {{if .Data}}{{range (index .Data "Categories")}}
            <option value="{{.ID}}">{{.Path}}</option>
            {{end}}{{end}}
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="snippetTags">Tags (comma-separated)</label>
        <input type="text" id="snippetTags" name="tags" class="form-control" placeholder="e.g. config, staging, credentials">
      </div>

      <div class="form-group">
        <label class="form-label" for="snippetContent">Snippet Content (Plain text, max 10,000 runes)</label>
        <textarea id="snippetContent" name="content" class="form-control" style="min-height: 280px;" maxlength="10000" oninput="updateCharCount(this)" required>{{if .Data}}{{if (index .Data "Content")}}{{index .Data "Content"}}{{end}}{{end}}</textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
        <a href="/" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Snippet</button>
      </div>
    </form>
  </div>
</div>

<script>
function updateCharCount(el) {
  const count = el.value.length;
  const counter = document.getElementById('charCounter');
  if (counter) {
    counter.textContent = count.toLocaleString() + ' / 10,000 characters';
    if (count > 9500) {
      counter.style.color = 'var(--danger)';
    } else {
      counter.style.color = 'var(--text-muted)';
    }
  }
}
</script>
{{end}}
