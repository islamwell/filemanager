{{template "base" .}}

{{define "content"}}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card-section">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <img src="/static/img/nq-logo.png" alt="NurulQuran" class="auth-logo" style="height: 56px; width: auto; object-fit: contain; margin-bottom: 0.75rem;">
      <h2 style="font-size: 1.35rem; margin-bottom: 0.35rem; font-weight: 700;">Create an NRQ Account</h2>
      <p style="color: var(--text-muted); font-size: 0.875rem; margin: 0;">Register for secure file and snippet storage</p>
    </div>

    <form action="/register" method="POST">
      <input type="hidden" name="_csrf" value="{{.CSRFToken}}">

      <div class="form-group">
        <label class="form-label" for="username">Username (3–32 characters)</label>
        <input type="text" id="username" name="username" class="form-control" minlength="3" maxlength="32" required autofocus value="{{if .Data}}{{if (index .Data "Username")}}{{index .Data "Username"}}{{end}}{{end}}">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password (min. 8 characters)</label>
        <input type="password" id="password" name="password" class="form-control" minlength="8" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" minlength="8" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.65rem;">Create Account</button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
      Already have an account? <a href="/login" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign in here</a>
    </div>
  </div>
</div>
{{end}}
