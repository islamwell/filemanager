{{template "base" .}}

{{define "content"}}
<div style="max-width: 420px; margin: 3rem auto;">
  <div class="card-section">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <img src="/static/img/nq-logo.png" alt="NurulQuran" class="auth-logo" style="height: 56px; width: auto; object-fit: contain; margin-bottom: 0.75rem;">
      <h2 style="font-size: 1.35rem; margin-bottom: 0.35rem; font-weight: 700;">Welcome to NRQ</h2>
      <p style="color: var(--text-muted); font-size: 0.875rem; margin: 0;">Sign in to access your files and snippets</p>
    </div>

    <form action="/login" method="POST">
      <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
      <input type="hidden" name="next" value="{{if .Data}}{{if (index .Data "Next")}}{{index .Data "Next"}}{{end}}{{end}}">

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" required autofocus value="{{if .Data}}{{if (index .Data "Username")}}{{index .Data "Username"}}{{end}}{{end}}">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.65rem;">Sign In</button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
      Don't have an account? <a href="/register" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create one here</a>
    </div>
  </div>
</div>
{{end}}
